{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h2>Update Profile Picture</h2>

        <form method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}

            <input type="file"
                   name="image"
                   class="form-control">

            <br>

            <button class="btn btn-primary">
                Upload
            </button>

        </form>

    </div>

</div>

{% endblock %}
