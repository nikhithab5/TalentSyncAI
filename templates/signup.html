{% extends 'base.html' %}
{% load socialaccount %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-lg border-0 p-4">

                <h2 class="text-center mb-4 fw-bold">
                    Create Account
                </h2>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100">
                        Sign Up
                    </button>

                </form>

                <div class="text-center my-3">
                    <span class="text-muted">
                        OR
                    </span>
                </div>

              <a href="/accounts/google/login/"
   class="btn btn-primary w-100 d-flex align-items-center justify-content-center">

    <img
        src="https://developers.google.com/identity/images/g-logo.png"
        alt="Google"
        width="20"
        height="20"
        class="me-2">

    Continue with Google

</a>

                <div class="text-center mt-4">

                    <p>
                        Already have an account?

                        <a href="{% url 'login' %}">
                            Login
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
