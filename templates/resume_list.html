{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">📄 My Resumes</h2>

    <div class="mb-3">
        <a href="{% url 'upload_resume' %}" class="btn btn-success">
            + Upload New Resume
        </a>
    </div>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">
            <tr>
                <th>Resume Name</th>
                <th>Uploaded On</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            {% for resume in resumes %}

            <tr>

                <td>
                    {{ resume.name }}
                </td>

                <td>
                    {{ resume.uploaded_at|date:"d M Y" }}
                </td>

                <td>

                    <a href="{{ resume.resume.url }}"
                       class="btn btn-success btn-sm"
                       target="_blank">
                        Download
                    </a>

                    <a href="{% url 'best_matching_jobs' resume.id %}"
                       class="btn btn-primary btn-sm">
                        Find Best Jobs
                    </a>

                    <a href="{% url 'delete_resume' resume.id %}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this resume?');">
                        Delete
                    </a>

                </td>

            </tr>

            {% empty %}

            <tr>

                <td colspan="3" class="text-center">
                    No resumes uploaded.
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
